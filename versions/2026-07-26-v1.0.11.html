<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="travel-map-version" content="1.0.11-loader-1.0.12">
  <title>青岛情侣旅行计划｜2026.08.09–08.16</title>
  <style>
    html,body{height:100%;margin:0;background:#eef1f5;font-family:system-ui,"Microsoft YaHei",sans-serif}
    #boot{height:100%;display:grid;place-items:center;color:#334155}
    .err{max-width:680px;padding:24px;line-height:1.7}
  </style>
</head>
<body>
  <div id="boot">正在加载青岛旅行地图 v1.0.11…</div>
  <script>
    (async()=>{
      const concatBytes=parts=>{
        const out=new Uint8Array(parts.reduce((sum,part)=>sum+part.length,0));
        let offset=0;
        for(const part of parts){out.set(part,offset);offset+=part.length}
        return out;
      };

      const decodePayload=(text,label)=>{
        const clean=text.replace(/[^A-Za-z0-9+/=]/g,'');
        if(!clean)throw new Error(label+' is empty');
        const units=[];
        let start=0;
        for(let i=0;i<clean.length;i++){
          if(clean[i]==='='){
            let end=i+1;
            while(end<clean.length&&clean[end]==='=')end++;
            units.push(clean.slice(start,end));
            start=end;
            i=end-1;
          }
        }
        if(start<clean.length)units.push(clean.slice(start));
        const decoded=units.filter(Boolean).map((unit,index)=>{
          const core=unit.replace(/=/g,'');
          if(!core)return new Uint8Array();
          const remainder=core.length%4;
          if(remainder===1){
            throw new Error(label+' segment '+(index+1)+' has invalid Base64 length');
          }
          const normalized=core+'='.repeat((4-remainder)%4);
          try{
            return Uint8Array.from(atob(normalized),c=>c.charCodeAt(0));
          }catch(e){
            throw new Error(label+' segment '+(index+1)+' Base64 decode failed: '+e.message);
          }
        });
        return concatBytes(decoded);
      };

      try{
        const root=location.pathname.includes('/versions/')?'../':'';
        const base=root+'assets/v1.0.11/';
        const names=['payload-0.b64','payload-1.b64','payload-2.b64','payload-3.b64'];
        const chunks=await Promise.all(names.map(async name=>{
          const response=await fetch(base+name+'?loader=1.0.12',{cache:'no-store'});
          if(!response.ok)throw new Error(name+' '+response.status);
          return response.text();
        }));
        const bytes=concatBytes(chunks.map((chunk,index)=>decodePayload(chunk,names[index])));
        if(bytes.length<2||bytes[0]!==0x1f||bytes[1]!==0x8b){
          throw new Error('Decoded payload is not a valid gzip stream');
        }
        if(typeof DecompressionStream!=='function'){
          throw new Error('This browser does not support gzip decompression');
        }
        const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
        const html=await new Response(stream).text();
        if(!/^\s*<!doctype html/i.test(html)&&!/^\s*<html/i.test(html)){
          throw new Error('Decompressed payload is not an HTML document');
        }
        document.open();
        document.write(html);
        document.close();
      }catch(e){
        document.getElementById('boot').innerHTML='<div class="err"><b>页面加载失败。</b><br>请刷新页面或使用最新版 Chrome、Edge、Safari、Firefox。<br><small>'+String(e)+'</small></div>';
      }
    })();
  </script>
  <noscript><div class="err">此页面需要启用 JavaScript。</div></noscript>
</body>
</html>
