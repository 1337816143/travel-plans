<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="travel-map-version" content="1.0.8"><title>青岛情侣旅行计划｜2026.08.09–08.16</title><style>html,body{height:100%;margin:0;background:#eef1f5;font-family:system-ui,"Microsoft YaHei",sans-serif}#boot{height:100%;display:grid;place-items:center;color:#334155}.err{max-width:680px;padding:24px;line-height:1.7}</style></head><body><div id="boot">正在加载青岛旅行地图 v1.0.8…</div><script>(async()=>{try{const root=location.pathname.includes('/versions/')?'../':'';const base=root+'assets/v1.0.6/';const patchBase=root+'assets/v1.0.8/';const names=['payload-0.b64','payload-1.b64','payload-2.b64','payload-3.b64','payload-4.b64','payload-5.b64','payload-6.b64','payload-7.b64'];const chunks=await Promise.all(names.map(async n=>{const r=await fetch(base+n,{cache:'no-store'});if(!r.ok)throw new Error(n+' '+r.status);return r.text()}));const patches=await Promise.all([0,1,2].map(async i=>{const r=await fetch(patchBase+'patch-'+i+'.b64',{cache:'no-store'});if(!r.ok)throw new Error('patch-'+i+' '+r.status);return r.text()}));const oldBytes=Uint8Array.from(atob(chunks.join('')),c=>c.charCodeAt(0));let ds=new DecompressionStream('gzip');let h=await new Response(new Blob([oldBytes]).stream().pipeThrough(ds)).text();const patchBytes=Uint8Array.from(atob(patches.join('')),c=>c.charCodeAt(0));ds=new DecompressionStream('gzip');const ops=JSON.parse(await new Response(new Blob([patchBytes]).stream().pipeThrough(ds)).text());for(const o of ops)h=h.slice(0,o[0])+o[2]+h.slice(o[1]);document.open();document.write(h);document.close()}catch(e){document.getElementById('boot').innerHTML='<div class="err"><b>页面加载失败。</b><br>请刷新页面或使用最新版 Chrome、Edge、Safari、Firefox。<br><small>'+String(e)+'</small></div>'}})();</script><noscript><div class="err">此页面需要启用 JavaScript。</div></noscript></body></html>
