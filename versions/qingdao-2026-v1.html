const PENDING=["2026-08-09至08-16逐日天气：目前超出可靠预报窗口，出发前72小时复核。","2026-08-13轮渡实际航班、购票方式和停航条件：出发前24—48小时向官方码头/平台复核。","精确潮汐时刻：公开检索结果不够一致，不写具体时刻；海边活动前24小时使用国家海洋信息中心或可靠潮汐服务复核。","租衣妆造具体商家：未找到足够可靠且可确认8月营业的门店，不虚构推荐；须电话确认后再锁定。","小鱼山、信号山、小青岛公园和啤酒博物馆的2026-08具体入园时段与预约规则：出发前7天复核。","酒店房型、含税总价、早餐、免费取消、评分与评价数：需在携程/飞猪/Booking/Trip.com按指定日期实时复核。"];
let currentDay='08-10';
let routeLayers=[];
const markerById=new Map();
const typeEmoji={attraction:'📍',transport:'🚇',hotel:'🏨',service:'👗',area:'◎'};
const typeColor={attraction:'#0f766e',transport:'#334155',hotel:'#7c3aed',service:'#e11d48',area:'#0ea5e9'};

function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
function outOfChina(lng,lat){return !(lng>72.004&&lng<137.8347&&lat>0.8293&&lat<55.8271)}
const PI=Math.PI,A=6378245,EE=.00669342162296594323;
function transformLat(x,y){let r=-100+2*x+3*y+.2*y*y+.1*x*y+.2*Math.sqrt(Math.abs(x));r+=(20*Math.sin(6*x*PI)+20*Math.sin(2*x*PI))*2/3;r+=(20*Math.sin(y*PI)+40*Math.sin(y/3*PI))*2/3;r+=(160*Math.sin(y/12*PI)+320*Math.sin(y*PI/30))*2/3;return r}
function transformLng(x,y){let r=300+x+2*y+.1*x*x+.1*x*y+.1*Math.sqrt(Math.abs(x));r+=(20*Math.sin(6*x*PI)+20*Math.sin(2*x*PI))*2/3;r+=(20*Math.sin(x*PI)+40*Math.sin(x/3*PI))*2/3;r+=(150*Math.sin(x/12*PI)+300*Math.sin(x/30*PI))*2/3;return r}
function wgs84ToGcj02(lng,lat){if(outOfChina(lng,lat))return[lng,lat];let dLat=transformLat(lng-105,lat-35),dLng=transformLng(lng-105,lat-35),rad=lat/180*PI,magic=Math.sin(rad);magic=1-EE*magic*magic;const sqrt=Math.sqrt(magic);dLat=dLat*180/((A*(1-EE))/(magic*sqrt)*PI);dLng=dLng*180/(A/sqrt*Math.cos(rad)*PI);return[lng+dLng,lat+dLat]}
function gcj(p){return p.gcj||wgs84ToGcj02(p.lng,p.lat)}
function amapUrls(p){const [lng,lat]=gcj(p),name=encodeURIComponent(p.name);return{nav:`https://uri.amap.com/navigation?from=&to=${lng.toFixed(6)},${lat.toFixed(6)},${name}&mode=car&callnative=1&src=travel-plans`,search:`https://uri.amap.com/search?keyword=${name}&city=青岛&src=travel-plans&callnative=0`}}
function openAmap(id){const p=POINTS.find(x=>x.id===id);if(!p)return;const u=amapUrls(p),mobile=/Android|iPhone|iPad|iPod/i.test(navigator.userAgent);if(mobile){location.href=u.nav;setTimeout(()=>{if(!document.hidden)window.open(u.search,'_blank','noopener')},1500)}else{window.open(u.search,'_blank','noopener')}}
window.openAmap=openAmap;

const osm=L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'});
const light=L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',{maxZoom:20,subdomains:'abcd',attribution:'© OpenStreetMap © CARTO'});
const map=L.map('map',{center:[36.06,120.38],zoom:12,layers:[osm],zoomControl:false});
L.control.zoom({position:'bottomright'}).addTo(map);
L.control.layers({'OSM标准底图':osm,'浅色底图':light},null,{position:'topright',collapsed:true}).addTo(map);
const clusters=L.markerClusterGroup({showCoverageOnHover:false,maxClusterRadius:46,spiderfyOnMaxZoom:true});
map.addLayer(clusters);

function iconFor(p){return L.divIcon({className:'',html:`<div class="marker-pin" style="background:${typeColor[p.type]||'#0f766e'}"><span>${typeEmoji[p.type]||'•'}</span></div>`,iconSize:[30,30],iconAnchor:[15,29],popupAnchor:[0,-28]})}
function popupHtml(p){const [glng,glat]=gcj(p),u=amapUrls(p);return `<div class="popup"><h3>${esc(p.name)}</h3><p>${esc(p.note)}</p><p><b>状态：</b>${esc(p.status)}</p><p class="coord">WGS84 ${p.lng.toFixed(6)}, ${p.lat.toFixed(6)}<br>GCJ-02 ${glng.toFixed(6)}, ${glat.toFixed(6)}</p><div class="popup-actions"><button onclick="openAmap('${p.id}')">高德导航</button><a class="alt" href="${u.search}" target="_blank" rel="noopener">高德搜索</a></div></div>`}
POINTS.filter(p=>p.type!=='area').forEach(p=>{const m=L.marker([p.lat,p.lng],{icon:iconFor(p),title:p.name}).bindPopup(popupHtml(p),{maxWidth:320});markerById.set(p.id,m);clusters.addLayer(m)});
const stayCircle=L.circle([36.0646,120.3760],{radius:1600,color:'#0ea5e9',weight:2,fillColor:'#38bdf8',fillOpacity:.12,dashArray:'8 7'}).addTo(map).bindPopup('<b>推荐住宿覆盖区</b><br>五四广场—江西路，优先步行10分钟内到2/3号线站点。');

function clearRoutes(){routeLayers.forEach(l=>map.removeLayer(l));routeLayers=[]}
function drawDay(date,fit=true){clearRoutes();currentDay=date;document.querySelectorAll('[data-day-btn]').forEach(b=>{const d=DAYS.find(x=>x.date===b.dataset.dayBtn);b.classList.toggle('day-active',b.dataset.dayBtn===date);b.style.background=b.dataset.dayBtn===date?d.color:''});const d=DAYS.find(x=>x.date===date);if(!d||!d.route.length)return;const pts=d.route.map(id=>POINTS.find(p=>p.id===id)).filter(Boolean);const line=L.polyline(pts.map(p=>[p.lat,p.lng]),{color:d.color,weight:4,opacity:.86,dashArray:'10 11',lineCap:'round'}).addTo(map);routeLayers.push(line);pts.forEach((p,i)=>{const n=L.marker([p.lat,p.lng],{icon:L.divIcon({className:'',html:`<div style="width:24px;height:24px;border-radius:50%;background:${d.color};color:#fff;border:2px solid #fff;box-shadow:0 2px 7px #334155;display:grid;place-items:center;font:700 11px system-ui">${i+1}</div>`,iconSize:[24,24],iconAnchor:[12,12]})}).addTo(map);routeLayers.push(n)});if(fit)map.fitBounds(line.getBounds(),{padding:[50,50],maxZoom:13})}
function fitDay(){const d=DAYS.find(x=>x.date===currentDay);if(!d||!d.route.length)return map.setView([36.0646,120.376],12);const pts=d.route.map(id=>POINTS.find(p=>p.id===id)).filter(Boolean);map.fitBounds(L.latLngBounds(pts.map(p=>[p.lat,p.lng])),{padding:[45,45],maxZoom:13})}
function focusPoint(id){const p=POINTS.find(x=>x.id===id),m=markerById.get(id);if(!p||!m)return;map.setView([p.lat,p.lng],15,{animate:true});clusters.zoomToShowLayer(m,()=>m.openPopup());if(innerWidth<=800)document.getElementById('panel').classList.remove('open')}
window.focusPoint=focusPoint;

function renderOverview(){const dayBtns=DAYS.filter(d=>d.route.length).map(d=>`<button class="btn" data-day-btn="${d.date}" style="border-color:${d.color}">${d.date}</button>`).join('');document.getElementById('overview').innerHTML=`
<div class="card success"><h2>核心结论</h2><p class="lead"><b>不换酒店。</b>连续住五四广场—江西路7晚，是对“体力一般、怕热、怕饿、需要午休”最友好的方案。黄岛与崂山各安排单日往返，省下两次整理、退房、寄存和搬运行李。</p></div>
<div class="card notice"><h3>当前最重要的不确定项</h3><p class="small">轮渡8月13日具体班次、逐日天气、精确潮汐、租衣商家及酒店实时价格均尚未达到可安全确认的程度。页面不以历史信息冒充未来事实。</p></div>
<div class="card"><h3>地图快捷筛选</h3><div class="button-row">${dayBtns}</div><p class="small muted">虚线只表示景点顺序，不代表真实道路。</p></div>
<div class="card"><h3>体力与情绪保护规则</h3><p class="small">每日早餐、午餐、补水和午休写入固定日程；12:00—15:30原则上不安排连续户外；每个下午最多一个主景点组；一旦出现头晕、恶心、持续烦躁或明显疲劳，立即取消下一站。</p></div>
<div class="card"><h3>日出与季节背景</h3><p class="small">8月11日青岛日出约05:13，04:45前抵达雕塑园。8月属于高温高湿和降雨较多时段；2026啤酒节预计至8月15日，黄岛安排上午并避开晚间高峰。</p></div>`;document.querySelectorAll('[data-day-btn]').forEach(b=>b.onclick=()=>drawDay(b.dataset.dayBtn,true));}
function renderItinerary(){document.getElementById('itinerary').innerHTML=DAYS.map((d,i)=>`<article class="card day-card ${i===1?'open':''}"><div class="day-head" data-toggle-day><span class="dot" style="background:${d.color}"></span><span class="day-title">${esc(d.label)}</span><span>⌄</span></div><div class="day-body"><ul class="timeline">${d.items.map(x=>`<li><div class="time">${esc(x[0])}</div><div class="event"><b>${esc(x[1])}</b><p>${esc(x[2])}</p></div></li>`).join('')}</ul><div class="planb"><b>Plan B：</b>${esc(d.planB)}</div>${d.route.length?`<div class="button-row" style="margin-top:10px"><button class="btn primary" onclick="drawDay('${d.date}',true)">在地图显示本日</button></div>`:''}</div></article>`).join('');document.querySelectorAll('[data-toggle-day]').forEach(h=>h.onclick=()=>h.parentElement.classList.toggle('open'));window.drawDay=drawDay;}
function renderSearch(){document.getElementById('search').innerHTML=`<div class="card"><h2>点位检索</h2><input class="searchbox" id="searchInput" placeholder="输入景点、酒店、地铁、日期或标签"><div class="results" id="results"></div></div><div class="card small"><b>坐标说明</b><p>Leaflet和OSM标记使用WGS84。弹窗同时显示经转换或人工核验的GCJ-02，用于高德导航。部分入口与景区中心不同，页面优先标入口或主要观景点。</p></div>`;const input=document.getElementById('searchInput'),res=document.getElementById('results');function run(){const q=input.value.trim().toLowerCase();const arr=POINTS.filter(p=>p.type!=='area'&&(!q||`${p.name} ${p.tags} ${p.status} ${(p.day||[]).join(' ')}`.toLowerCase().includes(q))).slice(0,30);res.innerHTML=arr.map(p=>`<div class="result" onclick="focusPoint('${p.id}')"><div class="result-icon">${typeEmoji[p.type]}</div><div><div class="result-name">${esc(p.name)}</div><div class="small muted">${esc(p.tags)}</div><span class="status">${esc(p.status)}</span></div></div>`).join('')||'<p class="small muted">没有匹配点位。</p>'}input.oninput=run;run();}
function renderLodging(){const schemes=LODGING.map(s=>`<div class="card scheme"><h3>${esc(s.name)} <span class="status">${esc(s.score)}</span></h3><p class="small"><b>优点：</b>${esc(s.pros)}</p><p class="small"><b>缺点：</b>${esc(s.cons)}</p><p class="small"><b>结论：</b>${esc(s.decision)}</p></div>`).join('');const rows=HOTEL_ROWS.map(r=>`<tr>${r.map(x=>`<td>${esc(x)}</td>`).join('')}</tr>`).join('');document.getElementById('lodging').innerHTML=`${schemes}<div class="card"><h3>候选酒店与价格核验表</h3><p class="small danger" style="padding:8px;border-radius:8px">无法可靠取得指定日期实时含税价，因此不估算、不伪造。下单前按2026-08-09入住、08-16退房、2成人1间房重新查询。</p><div class="table-wrap"><table class="hotel-table"><thead><tr><th>酒店</th><th>平台</th><th>房型</th><th>含税总价</th><th>日均</th><th>早餐/取消</th><th>评分/评价数</th><th>查询日期</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;}
function renderSources(){document.getElementById('sources').innerHTML=`<div class="card"><h2>信息来源</h2>${SOURCES.map(s=>`<div class="source"><a href="${s[1]}" target="_blank" rel="noopener">${esc(s[0])}</a><p>${esc(s[2])}</p></div>`).join('')}</div><div class="card danger"><h3>待核验事项</h3><ul class="pending">${PENDING.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div><div class="card small"><b>最后核验：</b>2026-07-25。<br><b>版本：</b>v1.0。</div>`;}
renderOverview();renderItinerary();renderSearch();renderLodging();renderSources();

document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===t));document.querySelectorAll('.section').forEach(s=>s.classList.toggle('active',s.id===t.dataset.tab))});
document.getElementById('fitAllBtn').onclick=()=>{clearRoutes();const bounds=L.latLngBounds(POINTS.filter(p=>p.type!=='area').map(p=>[p.lat,p.lng]));map.fitBounds(bounds,{padding:[35,35]})};
document.getElementById('clearRouteBtn').onclick=clearRoutes;document.getElementById('fitDayBtn').onclick=fitDay;document.getElementById('drawerBtn').onclick=()=>document.getElementById('panel').classList.toggle('open');
map.on('click',()=>{if(innerWidth<=800)document.getElementById('panel').classList.remove('open')});
drawDay('08-10',false);
setTimeout(()=>map.invalidateSize(),200);
</script>
</body>
