name: Validate Qingdao v3 foundation

on:
  pull_request:
    paths:
      - '.github/workflows/validate-v3.yml'
      - 'apps/**'
      - 'data/qingdao/**'
      - 'docs/architecture/**'
      - 'docs/deployment/**'
      - 'packages/**'
      - 'src-v2.5.5/**'
      - 'scripts/build-v2.5.5.mjs'
      - 'scripts/validate-v2.5.5.mjs'
      - 'scripts/check-v2.5.4-freeze.mjs'
      - 'scripts/check-v3-v2-parity.mjs'
      - 'scripts/check-v3-secrets.mjs'
      - 'scripts/check-v3-web-bundle.mjs'
      - 'scripts/package-v3-pages.mjs'
      - 'scripts/snapshot-v2-runtime-points.mjs'
      - 'scripts/validate-v3-pages.mjs'
      - 'v3/**'
      - 'eslint.config.js'
      - 'package-lock.json'
      - 'package.json'
      - 'tsconfig.base.json'
      - 'tsconfig.v3.json'
      - 'vitest.config.ts'
  push:
    branches:
      - main
      - 'agent/qingdao-v3-*'
      - agent/v2.5.5-v3-rain-beach-contingency
    paths:
      - '.github/workflows/validate-v3.yml'
      - 'apps/**'
      - 'data/qingdao/**'
      - 'packages/**'
      - 'src-v2.5.5/**'
      - 'scripts/build-v2.5.5.mjs'
      - 'scripts/validate-v2.5.5.mjs'
      - 'scripts/check-v2.5.4-freeze.mjs'
      - 'scripts/check-v3-v2-parity.mjs'
      - 'scripts/check-v3-secrets.mjs'
      - 'scripts/check-v3-web-bundle.mjs'
      - 'scripts/package-v3-pages.mjs'
      - 'scripts/snapshot-v2-runtime-points.mjs'
      - 'scripts/validate-v3-pages.mjs'
      - 'v3/**'
      - 'eslint.config.js'
      - 'package-lock.json'
      - 'package.json'
      - 'tsconfig.base.json'
      - 'tsconfig.v3.json'
      - 'vitest.config.ts'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Validate current root and v3 shared foundation
        run: npm run validate:v3
      - name: Verify remote v2.5.4 rollback anchor
        run: |
          test "$(git ls-remote origin refs/heads/archive/v2.5.4-stable | cut -f1)" = "95ecff2595c02cf550bada9ab5c318ee97768699"
      - name: Validate v2.5.5 and frozen rollback payload
        run: |
          node scripts/validate-v2.5.5.mjs
          node scripts/check-v2.5.4-freeze.mjs
      - name: Verify generated releases are committed
        run: |
          git diff --exit-code -- index.html service-worker.js src/v2.5.5.html assets/v2.5.5 v3
          test -z "$(git status --porcelain)"
