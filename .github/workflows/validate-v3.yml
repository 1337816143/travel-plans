name: Validate Qingdao v3 foundation

on:
  pull_request:
    paths:
      - '.github/workflows/validate-v3.yml'
      - 'apps/**'
      - 'data/qingdao/**'
      - 'docs/architecture/**'
      - 'packages/**'
      - 'scripts/check-v3-secrets.mjs'
      - 'scripts/check-v3-web-bundle.mjs'
      - 'scripts/snapshot-v2-runtime-points.mjs'
      - 'eslint.config.js'
      - 'package-lock.json'
      - 'package.json'
      - 'tsconfig.base.json'
      - 'tsconfig.v3.json'
      - 'vitest.config.ts'
  push:
    branches:
      - 'agent/qingdao-v3-*'
    paths:
      - '.github/workflows/validate-v3.yml'
      - 'apps/**'
      - 'data/qingdao/**'
      - 'packages/**'
      - 'scripts/check-v3-secrets.mjs'
      - 'scripts/check-v3-web-bundle.mjs'
      - 'scripts/snapshot-v2-runtime-points.mjs'
      - 'eslint.config.js'
      - 'package-lock.json'
      - 'package.json'
      - 'tsconfig.base.json'
      - 'tsconfig.v3.json'
      - 'vitest.config.ts'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Validate v3 shared foundation
        run: npm run validate:v3
      - name: Preserve v2.5.4 gates
        run: |
          npm run validate:v2
          npm run inspect:v2
          node scripts/validate-v2.5-practical.mjs
          node scripts/validate-v1.0.11-payload.mjs | tee /tmp/payload-validation.log
          grep -q 'NEWEST_VALID_VERSION=v2.5.4' /tmp/payload-validation.log
      - name: Verify validation is read-only
        run: git diff --exit-code
