name: Publish Qingdao travel map v1.0.1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Reconstruct and commit v1.0.1
        shell: bash
        run: |
          set -euo pipefail
          cat payload/v101.part.* | base64 --decode > /tmp/v101.tar.xz
          echo 'f6cea189e5643a1cb3670552e3cb1822d596c645151f29a9f897d5989341da2a  /tmp/v101.tar.xz' | sha256sum --check --strict
          tar -xJf /tmp/v101.tar.xz
          rm -rf payload
          echo 'f14e292fb45896281e346d7ce66e8c78a5d1f22c5c55162452ae9fe321563db4  index.html' | sha256sum --check --strict
          cmp -s index.html versions/2026-07-26-v1.0.1.html
          grep -q 'travel-plans-v1.0.1' index.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Publish Qingdao travel map v1.0.1 [skip ci]'
          git push origin HEAD:main

      - name: Prepare site artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp index.html _site/index.html
          cp -R versions _site/versions
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify v1.0.1 online
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 12 --retry-delay 5 --retry-all-errors -fsSL "$PAGE_URL" -o /tmp/live-index.html
          grep -q 'travel-map-version" content="1.0.1' /tmp/live-index.html
          grep -q 'travel-plans-v1.0.1' /tmp/live-index.html
          grep -q 'leaflet.markercluster' /tmp/live-index.html
          curl --retry 12 --retry-delay 5 --retry-all-errors -fsSL "${PAGE_URL%/}/versions/2026-07-26-v1.0.1.html" -o /tmp/live-version.html
          cmp -s /tmp/live-index.html /tmp/live-version.html

      - name: Record verified deployment
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        shell: bash
        run: |
          set -euo pipefail
          cat > DEPLOYMENT.md <<EOF
          # Deployment verification

          - Status: verified online
          - Version: v1.0.1
          - Validate committed HTML: success
          - Configure Pages step: success
          - Upload artifact step: success
          - Build job: success
          - Deploy job: success
          - Live endpoint verification: success
          - Page: ${PAGE_URL}
          - Workflow source commit: ${GITHUB_SHA}
          - HTML SHA-256: f14e292fb45896281e346d7ce66e8c78a5d1f22c5c55162452ae9fe321563db4
          - Archive match: live index is byte-identical to versions/2026-07-26-v1.0.1.html
          EOF
          git pull --rebase origin main
          git add DEPLOYMENT.md
          git commit -m 'Record v1.0.1 GitHub Pages deployment result [skip ci]'
          git push origin HEAD:main
