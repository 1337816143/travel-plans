name: Build and deploy Qingdao travel map

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct and verify site
        shell: bash
        run: |
          set -euo pipefail
          cat site/chunks/part-* | base64 --decode | gzip --decompress > index.html
          echo '6b05b78ebd638649a04cafb013f9acdc560add90c69f2127c01dda93af328086  index.html' | sha256sum --check --strict
          grep -q '<title>青岛情侣旅行计划｜2026.08.09—08.16</title>' index.html

          mkdir -p versions
          sed 's/v2\.0/v1.0/g' index.html > versions/qingdao-2026-v1.html
          cp index.html versions/qingdao-2026-v2.html

          mkdir -p _site/versions
          cp index.html _site/index.html
          cp versions/qingdao-2026-v1.html _site/versions/
          cp versions/qingdao-2026-v2.html _site/versions/
          touch _site/.nojekyll

      - name: Commit generated offline versions
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html versions/qingdao-2026-v1.html versions/qingdao-2026-v2.html
          if ! git diff --cached --quiet; then
            git commit -m 'Build versioned Qingdao travel map snapshots'
            git push
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
