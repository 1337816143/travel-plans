name: Build and deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct audited HTML artifacts
        shell: bash
        run: |
          set -euo pipefail
          if compgen -G "payload/site.tar.xz.b64.*" > /dev/null; then
            cat payload/site.tar.xz.b64.* | base64 --decode > /tmp/site-payload.tar.xz
            echo "f6a36344bacf2e9834fffe20bbbd97c2fc482b92678938e5402768ac2f755f7b  /tmp/site-payload.tar.xz" | sha256sum --check
            tar -xJf /tmp/site-payload.tar.xz
            rm -rf payload
            test -s index.html
            test -s versions/2026-07-25-v0.1.0.html
            test -s versions/2026-07-25-v1.0.0.html
            grep -q "页面自检通过" index.html
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Build audited travel map artifacts [skip ci]"
            git push
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
