name: Finalize unlimited planner days UI

on:
  push:
    branches:
      - agent/unlimited-planner-days
    paths:
      - '.github/workflows/finalize-unlimited-days-ui.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/unlimited-planner-days
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Fix day-input container and helper styling
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const viewPath = 'apps/web/src/view.ts';
          let view = fs.readFileSync(viewPath, 'utf8');
          const before = '<span class="days-input-wrap"><input type="number" min="1" step="1" inputmode="numeric" data-field="total-days" value="${escapeHtml(String(state.form.totalDays))}" aria-describedby="total-days-hint" /><small id="total-days-hint">正整数，不设产品上限</small></span>';
          const after = '<div class="days-input-wrap"><input type="number" min="1" step="1" inputmode="numeric" data-field="total-days" value="${escapeHtml(String(state.form.totalDays))}" aria-describedby="total-days-hint" /><small id="total-days-hint">正整数，不设产品上限</small></div>';
          if (!view.includes(before)) throw new Error('Unlimited-day input wrapper not found');
          view = view.replace(before, after);
          fs.writeFileSync(viewPath, view);

          const stylePath = 'apps/web/src/styles.css';
          let css = fs.readFileSync(stylePath, 'utf8');
          const marker = '.days-input-wrap {';
          if (!css.includes(marker)) {
            css += `\n\n.days-input-wrap {\n  display: grid;\n  gap: 4px;\n}\n\n.days-input-wrap small {\n  color: #71878a;\n  font-size: 9px;\n  font-weight: 600;\n  line-height: 1.4;\n}\n`;
          }
          fs.writeFileSync(stylePath, css);
          NODE
      - run: npx prettier --write apps/web/src/view.ts apps/web/src/styles.css packages/testing/tests/unlimited-planner-days.test.ts
      - name: Validate full v3 release and rollback guard
        run: npm run validate:v3
      - name: Commit final source and generated v3 package
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/finalize-unlimited-days-ui.yml
          git add -A
          git commit -m 'fix(planner): polish unlimited day input'
          git push origin HEAD:agent/unlimited-planner-days
