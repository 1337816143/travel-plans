name: Validate historical v1.0.12

on:
  push:
    branches:
      - main
    paths:
      - 'assets/v1.0.12/**'
      - 'src/v1.0.12.html'
      - '.github/workflows/validate-v1.0.12.yml'
  pull_request:
    paths:
      - 'assets/v1.0.12/**'
      - 'src/v1.0.12.html'
      - '.github/workflows/validate-v1.0.12.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init -q
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth=1 origin "${GITHUB_SHA}"
          git checkout -q FETCH_HEAD
      - name: Validate historical payload
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import vm from 'node:vm';
          import { gunzipSync } from 'node:zlib';
          const dir='assets/v1.0.12';
          const names=fs.readdirSync(dir).filter(name=>/^payload-\d+\.b64$/.test(name)).sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));
          if(names.length!==4)throw new Error('Expected four v1.0.12 payload files');
          const parts=names.map(name=>Buffer.from(fs.readFileSync(path.join(dir,name),'utf8').replace(/[^A-Za-z0-9+/=]/g,''),'base64'));
          const html=gunzipSync(Buffer.concat(parts)).toString('utf8');
          const source=fs.readFileSync('src/v1.0.12.html','utf8');
          if(html!==source)throw new Error('Historical v1.0.12 source and payload differ');
          if(!html.includes("const APP_VERSION='1.0.12'"))throw new Error('Historical runtime version is missing');
          [...html.matchAll(/<script(?![^>]*\bsrc=)[^>]*>([\s\S]*?)<\/script>/gi)].forEach((match,index)=>new vm.Script(match[1],{filename:`v1.0.12-${index}.js`}));
          console.log('Historical v1.0.12 payload and JavaScript are valid');
          NODE
