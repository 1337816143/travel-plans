name: Build v2 modular release

on:
  push:
    branches:
      - agent/v2.1.0-unified-overlay
    paths:
      - 'src-v2/**'
      - 'scripts/extract-v2-source.mjs'
      - 'scripts/build-v2.mjs'
      - '.github/workflows/build-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v2.1.0-unified-overlay
      - name: Build canonical v2.1.0 release
        run: node scripts/build-v2.mjs
      - name: Commit generated release
        run: |
          if git diff --quiet -- src-v2 src/v2.1.0.html assets/v2.1.0 index.html versions service-worker.js PAGES_SETUP.md DEPLOYMENT.md; then
            echo "v2.1.0 build is reproducible and unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-v2 src/v2.1.0.html assets/v2.1.0 index.html versions service-worker.js PAGES_SETUP.md DEPLOYMENT.md
          git commit -m "Build travel map v2.1.0"
          git push origin HEAD:agent/v2.1.0-unified-overlay