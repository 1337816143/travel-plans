name: Build v2 modular release

on:
  push:
    branches:
      - agent/v2.5.3-food-search-precision
    paths:
      - 'src-v2/**'
      - 'scripts/migrate-v2.5.3.mjs'
      - 'scripts/finalize-v2.5.3.mjs'
      - 'scripts/validate-data-schema.mjs'
      - 'scripts/build-v2.mjs'
      - 'scripts/validate-v2.mjs'
      - 'scripts/inspect-v2.5.mjs'
      - 'tests/**'
      - 'package.json'
      - '.github/workflows/build-v2.yml'
  pull_request:
    paths:
      - 'src-v2/**'
      - 'scripts/migrate-v2.5.3.mjs'
      - 'scripts/finalize-v2.5.3.mjs'
      - 'scripts/validate-data-schema.mjs'
      - 'scripts/build-v2.mjs'
      - 'scripts/validate-v2.mjs'
      - 'scripts/inspect-v2.5.mjs'
      - 'tests/**'
      - 'package.json'
      - '.github/workflows/build-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-v2.5.3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply canonical migration and precision finalization
        run: |
          node scripts/migrate-v2.5.3.mjs
          node scripts/finalize-v2.5.3.mjs
      - name: Install deterministic build dependencies
        run: npm install --ignore-scripts
      - name: Rebuild food search precision release v2.5.3
        run: node scripts/build-v2.mjs
      - name: Verify generated release artifacts are committed and reproducible
        run: |
          TARGETS="src-v2/data/generated/schema-report.js src/v2.5.3.html assets/v2.5.3 index.html versions service-worker.js PAGES_SETUP.md DEPLOYMENT.md MIGRATION_V2.5.3.json DATA_SCHEMA_REPORT_v2.5.3.json BUNDLE_BUDGET_v2.5.3.json"
          if ! git diff --quiet -- $TARGETS; then
            echo "::error::Generated v2.5.3 release artifacts differ from committed files"
            git diff --stat -- $TARGETS
            git diff --name-only -- $TARGETS
            exit 1
          fi
          echo "v2.5.3 release artifacts are deterministic and current"
