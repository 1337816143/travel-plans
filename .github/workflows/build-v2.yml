name: Build v2 modular release

on:
  push:
    branches:
      - agent/v2.3.0-behavior-modules-calendar
    paths:
      - 'src-v2/**'
      - 'scripts/extract-v2-source.mjs'
      - 'scripts/migrate-v2.2.mjs'
      - 'scripts/patch-v2.2-source.mjs'
      - 'scripts/migrate-v2.3.mjs'
      - 'scripts/validate-data-schema.mjs'
      - 'scripts/build-v2.mjs'
      - 'package.json'
      - '.github/workflows/build-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v2.3.0-behavior-modules-calendar
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install deterministic build dependencies
        run: npm install --ignore-scripts
      - name: Migrate behavior modules and build v2.3.0
        run: node scripts/build-v2.mjs
      - name: Commit generated release
        run: |
          if git diff --quiet -- src-v2 src/v2.3.0.html assets/v2.3.0 index.html versions service-worker.js PAGES_SETUP.md DEPLOYMENT.md MIGRATION_V2.3.json DATA_SCHEMA_REPORT_v2.3.json; then
            echo "v2.3.0 build is reproducible and unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-v2 src/v2.3.0.html assets/v2.3.0 index.html versions service-worker.js PAGES_SETUP.md DEPLOYMENT.md MIGRATION_V2.3.json DATA_SCHEMA_REPORT_v2.3.json
          git commit -m "Build travel map v2.3.0"
          git push origin HEAD:agent/v2.3.0-behavior-modules-calendar
