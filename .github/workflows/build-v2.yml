name: Build v2 modular release

on:
  push:
    branches:
      - agent/v2.2.0-data-adapters-reminders
    paths:
      - 'src-v2/**'
      - 'scripts/extract-v2-source.mjs'
      - 'scripts/migrate-v2.2.mjs'
      - 'scripts/patch-v2.2-source.mjs'
      - 'scripts/patch-pages-workflow-v2.2.mjs'
      - 'scripts/build-v2.mjs'
      - '.github/workflows/build-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v2.2.0-data-adapters-reminders
      - name: Migrate canonical data and build v2.2.0
        run: |
          node scripts/patch-pages-workflow-v2.2.mjs
          node scripts/patch-v2.2-source.mjs
          node scripts/build-v2.mjs
      - name: Commit generated release
        run: |
          if git diff --quiet -- src-v2 src/v2.2.0.html assets/v2.2.0 index.html versions service-worker.js PAGES_SETUP.md DEPLOYMENT.md MIGRATION_V2.2.json .github/workflows/validate-pages-payload.yml; then
            echo "v2.2.0 build is reproducible and unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-v2 src/v2.2.0.html assets/v2.2.0 index.html versions service-worker.js PAGES_SETUP.md DEPLOYMENT.md MIGRATION_V2.2.json .github/workflows/validate-pages-payload.yml
          git commit -m "Build travel map v2.2.0"
          git push origin HEAD:agent/v2.2.0-data-adapters-reminders
