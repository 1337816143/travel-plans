name: Validate Pages payload

on:
  push:
    branches:
      - main
      - agent/v2.1.0-unified-overlay
  pull_request:
    paths:
      - 'index.html'
      - 'versions/**'
      - 'assets/v1.0.10/**'
      - 'assets/v1.0.11/**'
      - 'assets/v1.0.12/**'
      - 'assets/v1.0.13/**'
      - 'assets/v1.0.14/**'
      - 'assets/v1.0.15/**'
      - 'assets/v2.0.0/**'
      - 'assets/v2.0.1/**'
      - 'assets/v2.1.0/**'
      - 'scripts/validate-v1.0.11-payload.mjs'
      - '.github/workflows/validate-pages-payload.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init -q
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth=1 origin "${GITHUB_SHA}"
          git checkout -q FETCH_HEAD
      - name: Build v2 release when canonical source is present
        if: ${{ hashFiles('src-v2/template.html') != '' }}
        run: node scripts/build-v2.mjs
      - name: Find newest valid compressed page
        run: |
          node scripts/validate-v1.0.11-payload.mjs | tee /tmp/payload-validation.log
          if [ -f src-v2/template.html ]; then
            grep -q 'NEWEST_VALID_VERSION=v2.1.0' /tmp/payload-validation.log
          else
            grep -q 'NEWEST_VALID_VERSION=v1.0.15' /tmp/payload-validation.log
          fi
      - name: Check loader JavaScript syntax
        if: always()
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import vm from 'node:vm';
          const html = fs.readFileSync('index.html', 'utf8');
          const match = html.match(/<script>([\s\S]*?)<\/script>/i);
          if (!match) throw new Error('index.html: inline script not found');
          new vm.Script(match[1], { filename: 'index.html' });
          const expected = fs.existsSync('src-v2/template.html') ? "['2.1.0','1.0.15']" : "['1.0.15','1.0.14']";
          if (!html.includes(expected)) throw new Error('fallback order is missing: '+expected);
          if (!html.includes('<title>青岛旅行计划</title>')) throw new Error('browser title is incorrect');
          console.log('index.html: JavaScript syntax, title and fallback order OK');
          NODE