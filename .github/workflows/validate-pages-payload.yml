name: Validate Pages payload

on:
  push:
    branches:
      - main
      - agent/v2.5.0-usability-completeness
  pull_request:
    paths:
      - 'index.html'
      - 'versions/**'
      - 'assets/v1.0.15/**'
      - 'assets/v2.4.0/**'
      - 'assets/v2.5.0/**'
      - 'scripts/build-v2.mjs'
      - 'scripts/validate-v1.0.11-payload.mjs'
      - 'package.json'
      - '.github/workflows/validate-pages-payload.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install deterministic build dependencies
        run: npm install --ignore-scripts
      - name: Build v2 release from canonical source
        run: node scripts/build-v2.mjs
      - name: Find newest valid compressed page
        run: |
          node scripts/validate-v1.0.11-payload.mjs | tee /tmp/payload-validation.log
          grep -q 'NEWEST_VALID_VERSION=v2.5.0' /tmp/payload-validation.log
          test -s assets/v2.5.0/lazy-tools.js
      - name: Check loader and lazy bundle syntax
        if: always()
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import vm from 'node:vm';
          const html = fs.readFileSync('index.html', 'utf8');
          const match = html.match(/<script>([\s\S]*?)<\/script>/i);
          if (!match) throw new Error('index.html: inline script not found');
          new vm.Script(match[1], { filename: 'index.html' });
          new vm.Script(fs.readFileSync('assets/v2.5.0/lazy-tools.js','utf8'), { filename: 'lazy-tools.js' });
          if (!html.includes("['2.5.0','1.0.15']")) throw new Error('v2.5.0 fallback order is missing');
          if (!html.includes('<title>青岛旅行计划</title>')) throw new Error('browser title is incorrect');
          console.log('index.html and lazy-tools.js syntax, title and fallback order OK');
          NODE
