name: Playwright Qingdao v3 sidecar

on:
  pull_request:
    paths:
      - '.github/workflows/playwright-v3.yml'
      - 'apps/web/**'
      - 'data/qingdao/**'
      - 'packages/domain/**'
      - 'packages/map-core/**'
      - 'packages/planner/**'
      - 'packages/schema/**'
      - 'packages/storage/**'
      - 'tests-v3/**'
      - 'playwright.v3.config.js'
      - 'package-lock.json'
      - 'package.json'
  push:
    branches:
      - 'agent/qingdao-v3-*'
    paths:
      - '.github/workflows/playwright-v3.yml'
      - 'apps/web/**'
      - 'data/qingdao/**'
      - 'packages/domain/**'
      - 'packages/map-core/**'
      - 'packages/planner/**'
      - 'packages/schema/**'
      - 'packages/storage/**'
      - 'tests-v3/**'
      - 'playwright.v3.config.js'
      - 'package-lock.json'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sidecar-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Build Phase 3 sidecar
        run: |
          npm run build:web:v3
          npm run check:bundle:web:v3
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Run desktop and phone closed-loop tests
        run: npm run test:e2e:v3
      - name: Verify test workflow did not change source
        run: test -z "$(git status --porcelain)"
      - name: Upload screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qingdao-v3-phase3-showcase
          path: |
            artifacts/v3-web
            playwright-report-v3
            test-results-v3
          if-no-files-found: ignore
          retention-days: 14
