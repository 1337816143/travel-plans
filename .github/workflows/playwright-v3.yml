name: Playwright Qingdao v3 complete guide and planner

on:
  pull_request:
    paths:
      - '.github/workflows/playwright-v3.yml'
      - 'apps/web/**'
      - 'data/qingdao/**'
      - 'packages/domain/**'
      - 'packages/map-core/**'
      - 'packages/planner/**'
      - 'packages/schema/**'
      - 'packages/storage/**'
      - 'scripts/check-v2.5.4-freeze.mjs'
      - 'scripts/check-v3-v2-parity.mjs'
      - 'scripts/package-v3-pages.mjs'
      - 'scripts/serve-pages-preview.mjs'
      - 'scripts/validate-v3-pages.mjs'
      - 'tests-v3/**'
      - 'v3/**'
      - 'playwright.v3.config.js'
      - 'package-lock.json'
      - 'package.json'
  push:
    branches:
      - main
      - 'agent/qingdao-v3-*'
    paths:
      - '.github/workflows/playwright-v3.yml'
      - 'apps/web/**'
      - 'data/qingdao/**'
      - 'packages/domain/**'
      - 'packages/map-core/**'
      - 'packages/planner/**'
      - 'packages/schema/**'
      - 'packages/storage/**'
      - 'scripts/check-v2.5.4-freeze.mjs'
      - 'scripts/check-v3-v2-parity.mjs'
      - 'scripts/package-v3-pages.mjs'
      - 'scripts/serve-pages-preview.mjs'
      - 'scripts/validate-v3-pages.mjs'
      - 'tests-v3/**'
      - 'v3/**'
      - 'playwright.v3.config.js'
      - 'package-lock.json'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  complete-guide-planner-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Build complete guide and real-map planner preview
        run: |
          npm run build:pages:v3
          npm run check:bundle:web:v3
          npm run validate:pages:v3
          git diff --exit-code -- v3
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Run desktop and phone closed-loop tests
        run: npm run test:e2e:v3
      - name: Verify test workflow did not change source
        run: test -z "$(git status --porcelain)"
      - name: Upload screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qingdao-v3-complete-guide-planner-preview
          path: |
            artifacts/v3-web
            playwright-report-v3
            test-results-v3
            v3/release-manifest.json
          if-no-files-found: ignore
          retention-days: 14
