name: Playwright v2 visual regression

on:
  push:
    branches:
      - agent/v2.5.2-tools-layout-food-map
    paths:
      - 'src-v2/**'
      - 'scripts/validate-data-schema.mjs'
      - 'scripts/build-v2.mjs'
      - 'tests/**'
      - 'package.json'
      - 'playwright.config.js'
      - '.github/workflows/playwright-v2.yml'
  pull_request:
    paths:
      - 'src-v2/**'
      - 'scripts/validate-data-schema.mjs'
      - 'scripts/build-v2.mjs'
      - 'tests/**'
      - 'package.json'
      - 'playwright.config.js'
      - '.github/workflows/playwright-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Playwright test runner
        run: npm install
      - name: Install Chromium, WebKit and system dependencies
        run: npx playwright install --with-deps chromium webkit
      - name: Run desktop, flagship phone and landscape tests
        run: npm run test:e2e
      - name: Upload visual report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-v2.5.2-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14
