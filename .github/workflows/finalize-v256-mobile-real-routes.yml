# Runs only on the release branch and removes itself after a fully green validation.
# This revision starts from the complete source/audit set; do not add branch commits while it runs.
name: Finalize v2.5.6 mobile actual routes

on:
  push:
    branches:
      - agent/mobile-real-routes-rain-v256
    paths:
      - '.github/workflows/finalize-v256-mobile-real-routes.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: finalize-v256-mobile-real-routes
  cancel-in-progress: true

jobs:
  build-test-publish-branch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/mobile-real-routes-rain-v256
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Apply v2.5.6 to v3 synchronization
        run: node scripts/apply-v256-v3-sync.mjs
      - name: Format touched governed files
        run: >-
          npx prettier --write
          package.json
          data/qingdao/ops/current-status-2026-08-09.json
          apps/web/index.html
          apps/web/rain.html
          apps/web/src/view.ts
          apps/web/src/rain-entry.ts
          scripts/package-v3-pages.mjs
          scripts/validate-v3-pages.mjs
          scripts/check-v3-v2-parity.mjs
          tests-v3/phase2-web.spec.js
          tests-v3/rain-contingency.spec.ts
          tests-v3/v256-mobile-real-routes.spec.js
      - name: Validate v2.5.6 package directly
        run: npm run validate:v2
      - name: Validate full v3 synchronized release
        run: npm run validate:v3
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Run desktop and 430x932 mobile closed-loop tests
        run: npm run test:e2e:v3
      - name: Confirm frozen v2.5.4 rollback again
        run: npm run check:freeze:v2.5.4
      - name: Commit validated release source and generated packages
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm scripts/apply-v256-v3-sync.mjs .github/workflows/finalize-v256-mobile-real-routes.yml
          git add -A
          git commit -m 'feat: ship v2.5.6 mobile actual routes and rain day paging'
          git push origin HEAD:agent/mobile-real-routes-rain-v256
