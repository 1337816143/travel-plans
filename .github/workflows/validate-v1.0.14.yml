name: Validate historical v1.0.14

on:
  push:
    branches:
      - main
      - agent/v1.0.15-stable-map-state
    paths:
      - 'assets/v1.0.14/**'
      - 'src/v1.0.14.html'
      - 'scripts/validate-v1.0.14.mjs'
      - 'versions/2026-07-27-v1.0.14.html'
      - '.github/workflows/validate-v1.0.14.yml'
  pull_request:
    paths:
      - 'assets/v1.0.14/**'
      - 'src/v1.0.14.html'
      - 'scripts/validate-v1.0.14.mjs'
      - 'versions/2026-07-27-v1.0.14.html'
      - '.github/workflows/validate-v1.0.14.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init -q
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth=1 origin "${GITHUB_SHA}"
          git checkout -q FETCH_HEAD
      - name: Validate historical v1.0.14 payload
        run: node scripts/validate-v1.0.14.mjs
