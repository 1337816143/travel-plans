name: Build v1.0.14

on:
  push:
    branches:
      - agent/v1.0.14-map-weather-mobile
    paths:
      - 'src/amap-v1.0.14-*'
      - 'scripts/build-v1.0.14.mjs'
      - 'scripts/finalize-v1.0.14.mjs'
      - '.github/workflows/build-v1.0.14.yml'
  pull_request:
    paths:
      - 'src/amap-v1.0.14-*'
      - 'scripts/build-v1.0.14.mjs'
      - 'scripts/finalize-v1.0.14.mjs'
      - '.github/workflows/build-v1.0.14.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && 'agent/v1.0.14-map-weather-mobile' || github.sha }}
      - name: Build v1.0.14 payload
        id: build
        shell: bash
        run: |
          set +e
          { node scripts/build-v1.0.14.mjs && node scripts/finalize-v1.0.14.mjs; } 2>&1 | tee /tmp/build-v1.0.14.log
          status=${PIPESTATUS[0]}
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Commit build diagnostic
        if: github.event_name == 'push' && steps.build.outputs.status != '0'
        run: |
          cp /tmp/build-v1.0.14.log BUILD_V1.0.14_ERROR.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BUILD_V1.0.14_ERROR.txt
          git commit -m "Record v1.0.14 build error" || true
          git push origin HEAD:agent/v1.0.14-map-weather-mobile
      - name: Fail unsuccessful build
        if: steps.build.outputs.status != '0'
        run: exit 1
      - name: Commit generated site
        if: github.event_name == 'push' && steps.build.outputs.status == '0'
        run: |
          rm -f BUILD_V1.0.14_ERROR.txt
          if git diff --quiet -- index.html assets/v1.0.14 src/v1.0.14.html versions PAGES_SETUP.md DEPLOYMENT.md BUILD_V1.0.14_ERROR.txt 2>/dev/null; then
            echo "Generated site unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A index.html assets/v1.0.14 src/v1.0.14.html versions PAGES_SETUP.md DEPLOYMENT.md BUILD_V1.0.14_ERROR.txt
          git commit -m "Build Qingdao travel map v1.0.14"
          git push origin HEAD:agent/v1.0.14-map-weather-mobile

# The generated loaders are finalized after payload creation so regex escapes remain literal.
