name: Validate unlimited planner days browser flow

on:
  push:
    branches:
      - agent/unlimited-planner-days
    paths:
      - '.github/workflows/fix-unlimited-days-e2e.yml'

permissions:
  contents: write

jobs:
  fix-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/unlimited-planner-days
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Update E2E to use free numeric day input
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const file = 'tests-v3/phase2-web.spec.js';
          let source = fs.readFileSync(file, 'utf8');
          const before = `  await page.locator('[data-field="total-days"]').selectOption('1');`;
          const after = `  const totalDays = page.locator('[data-field="total-days"]');\n  await expect(totalDays).toHaveAttribute('type', 'number');\n  await expect(totalDays).not.toHaveAttribute('max', /.+/);\n  await totalDays.fill('1');\n  await totalDays.press('Tab');`;
          const matches = source.split(before).length - 1;
          if (matches !== 1) throw new Error(`Expected exactly one legacy total-days selectOption call, found ${matches}`);
          source = source.replace(before, after);
          fs.writeFileSync(file, source);
          NODE
      - run: npx prettier --write tests-v3/phase2-web.spec.js
      - name: Validate source, planner, build and frozen rollback
        run: npm run validate:v3
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run desktop and mobile closed-loop tests
        run: npm run test:e2e:v3
      - name: Commit validated regression update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/fix-unlimited-days-e2e.yml
          git add -A
          git commit -m 'test(planner): use free day input in browser regression'
          git push origin HEAD:agent/unlimited-planner-days
