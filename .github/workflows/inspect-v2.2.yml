name: Inspect v2.4 architecture boundaries
on:
  push:
    branches:
      - agent/v2.4.0-context-services-risk
    paths:
      - 'scripts/inspect-v2.4.mjs'
      - 'src-v2/app/legacy-app.js'
      - 'src-v2/core/app-state.js'
      - 'src-v2/map/**'
      - 'src-v2/services/**'
      - 'src-v2/ui/**'
      - 'assets/v2.4.0/**'
      - 'BUNDLE_BUDGET_v2.4.json'
      - '.github/workflows/inspect-v2.2.yml'
  pull_request:
    paths:
      - 'scripts/inspect-v2.4.mjs'
      - 'src-v2/app/legacy-app.js'
      - 'src-v2/core/app-state.js'
      - 'src-v2/map/**'
      - 'src-v2/services/**'
      - 'src-v2/ui/**'
      - 'assets/v2.4.0/**'
      - 'BUNDLE_BUDGET_v2.4.json'
      - '.github/workflows/inspect-v2.2.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/inspect-v2.4.mjs
