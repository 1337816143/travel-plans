name: Finalize v2.5.7 check-in guide

on:
  push:
    branches:
      - agent/v257-checkin
    paths:
      - '.github/workflows/finalize-v257-checkin.yml'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: finalize-v257-checkin
  cancel-in-progress: true

jobs:
  validate-build-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v257-checkin
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Validate materialized v2.5.7 and v3 release
        shell: bash
        run: |
          set +e
          mkdir -p diagnostics
          LOG_TMP=/tmp/v2.5.7-validation.log
          LOG=diagnostics/v2.5.7-validation.log
          : > "$LOG_TMP"
          run_step() {
            name="$1"; shift
            printf '\n===== %s =====\n' "$name" | tee -a "$LOG_TMP"
            "$@" >> "$LOG_TMP" 2>&1
            code=$?
            printf 'EXIT_CODE=%s\n' "$code" | tee -a "$LOG_TMP"
            if [ "$code" -ne 0 ]; then
              printf 'FAILED_STEP=%s\n' "$name" | tee -a "$LOG_TMP"
              return "$code"
            fi
            return 0
          }

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          failed=0
          run_step 'npm-ci' npm ci --ignore-scripts || failed=1
          if [ "$failed" -eq 0 ]; then run_step 'interaction-and-fallback-fix' node scripts/fix-v257-tab-persistence-and-fallbacks.mjs || failed=1; fi
          if [ "$failed" -eq 0 ]; then
            run_step 'prettier' npx prettier --write apps/web/checkin.html src-v2.5.7/checkin-food-seaview.js tests-v3/v257-checkin-food-seaview.spec.js || failed=1
          fi
          if [ "$failed" -eq 0 ]; then run_step 'validate-v2.5.7' npm run validate:v2 || failed=1; fi
          if [ "$failed" -eq 0 ]; then run_step 'validate-v3' npm run validate:v3 || failed=1; fi

          if [ "$failed" -eq 0 ]; then
            rm -f diagnostics/v2.5.7-validation.log
            git add -A
            git commit -m 'fix: persist v2.5.7 check-in tabs and full itinerary camera coverage' || true
            git push origin HEAD:agent/v257-checkin || failed=1
          fi

          if [ "$failed" -eq 0 ]; then run_step 'install-chromium' npx playwright install --with-deps chromium || failed=1; fi
          if [ "$failed" -eq 0 ]; then run_step 'playwright-checkin-focused' npx playwright test tests-v3/v257-checkin-food-seaview.spec.js --config playwright.v3.config.js || failed=1; fi
          if [ "$failed" -eq 0 ]; then run_step 'playwright-all-v3' npm run test:e2e:v3 || failed=1; fi
          if [ "$failed" -eq 0 ]; then run_step 'freeze-v2.5.4' npm run check:freeze:v2.5.4 || failed=1; fi

          if [ "$failed" -ne 0 ]; then
            printf '\nRESULT=FAIL\n' >> "$LOG_TMP"
            git clean -fdx
            mkdir -p diagnostics
            cp "$LOG_TMP" "$LOG"
            git add "$LOG"
            git commit -m 'ci: report v2.5.7 validation failure' || true
            git push origin HEAD:agent/v257-checkin
            exit 1
          fi

          printf '\nRESULT=PASS\n' >> "$LOG_TMP"
          rm -f diagnostics/v2.5.7-validation.log
          rm -f scripts/fix-v257-build-script.mjs scripts/apply-v257-runtime-fixes.mjs scripts/apply-v257-v3-sync.mjs scripts/apply-v257-checkin-entry-fix.mjs scripts/fix-v257-tab-persistence-and-fallbacks.mjs .github/workflows/finalize-v257-checkin.yml
          git add -A
          git commit -m 'feat: ship v2.5.7 check-in camera spots, food and coast guide'
          git push origin HEAD:agent/v257-checkin
