name: Build v1.0.13

on:
  push:
    branches:
      - agent/improve-amap-ux
    paths:
      - 'src/amap-v1.0.13-*'
      - 'scripts/build-v1.0.13.mjs'
      - '.github/workflows/build-v1.0.13.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/improve-amap-ux
      - name: Build v1.0.13 payload
        run: node scripts/build-v1.0.13.mjs
      - name: Commit generated site
        run: |
          if git diff --quiet -- index.html assets/v1.0.13 src/v1.0.13.html versions PAGES_SETUP.md DEPLOYMENT.md 2>/dev/null; then
            echo "Generated site unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/v1.0.13 src/v1.0.13.html versions PAGES_SETUP.md DEPLOYMENT.md
          git commit -m "Build Qingdao travel map v1.0.13"
          git push origin HEAD:agent/improve-amap-ux
