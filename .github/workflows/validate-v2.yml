name: Validate v2 modular release

on:
  push:
    branches:
      - agent/v2.5.3-food-search-precision
  pull_request:
    paths:
      - 'src-v2/**'
      - 'scripts/migrate-v2.5.3.mjs'
      - 'scripts/finalize-v2.5.3.mjs'
      - 'scripts/validate-data-schema.mjs'
      - 'scripts/build-v2.mjs'
      - 'scripts/validate-v2.mjs'
      - 'scripts/validate-v2.5-practical.mjs'
      - 'assets/v2.5.3/**'
      - 'src/v2.5.3.html'
      - 'index.html'
      - 'service-worker.js'
      - 'package.json'
      - '.github/workflows/validate-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply v2.5.3 canonical migration and precision finalization
        run: |
          node scripts/migrate-v2.5.3.mjs
          node scripts/finalize-v2.5.3.mjs
      - name: Install deterministic build dependencies
        run: npm install --ignore-scripts
      - name: Rebuild from canonical source
        run: |
          if ! node scripts/build-v2.mjs > /tmp/v253-build.log 2>&1; then
            echo '--- v2.5.3 build failure ---'
            tail -200 /tmp/v253-build.log
            exit 1
          fi
          tail -100 /tmp/v253-build.log
      - name: Upload build diagnostic
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: v2.5.3-build-error
          path: /tmp/v253-build.log
          if-no-files-found: error
      - name: Validate store, services, food search, precision data and release chain
        run: |
          node scripts/validate-v2.mjs
          node scripts/validate-v2.5-practical.mjs
      - name: Upload preview site
        uses: actions/upload-artifact@v4
        with:
          name: travel-plans-v2.5.3-preview
          path: |
            index.html
            service-worker.js
            assets/v2.5.3
            assets/v1.0.15
            versions/2026-07-31-v2.5.3.html
            versions/2026-07-27-v1.0.15.html
            DATA_SCHEMA_REPORT_v2.5.3.json
            MIGRATION_V2.5.3.json
            BUNDLE_BUDGET_v2.5.3.json
          if-no-files-found: error
