name: Validate v2 modular release

on:
  push:
    branches:
      - agent/v2.4.0-context-services-risk
  pull_request:
    paths:
      - 'src-v2/**'
      - 'scripts/migrate-v2.4.mjs'
      - 'scripts/migrate-v2.4-features.mjs'
      - 'scripts/validate-data-schema.mjs'
      - 'scripts/build-v2.mjs'
      - 'scripts/validate-v2.mjs'
      - 'assets/v2.4.0/**'
      - 'src/v2.4.0.html'
      - 'index.html'
      - 'service-worker.js'
      - 'package.json'
      - '.github/workflows/validate-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install deterministic build dependencies
        run: npm install --ignore-scripts
      - name: Rebuild from canonical source
        run: |
          if ! node scripts/build-v2.mjs > /tmp/v24-build.log 2>&1; then
            echo '--- v2.4 build failure ---'
            tail -120 /tmp/v24-build.log
            exit 1
          fi
          tail -40 /tmp/v24-build.log
      - name: Upload build diagnostic
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: v2.4-build-error
          path: /tmp/v24-build.log
          if-no-files-found: error
      - name: Validate legacy elimination, contexts, services and risk tools
        run: node scripts/validate-v2.mjs
      - name: Upload preview site
        uses: actions/upload-artifact@v4
        with:
          name: travel-plans-v2.4.0-preview
          path: |
            index.html
            service-worker.js
            assets/v2.4.0
            assets/v1.0.15
            versions/2026-07-28-v2.4.0.html
            versions/2026-07-27-v1.0.15.html
            DATA_SCHEMA_REPORT_v2.4.json
            MIGRATION_V2.4.json
            BUNDLE_BUDGET_v2.4.json
          if-no-files-found: error
