<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="travel-map-version" content="1.0.12-recovery">
  <title>青岛情侣旅行计划｜2026.08.09–08.16</title>
  <style>
    html,body{height:100%;margin:0;background:#eef1f5;font-family:system-ui,"Microsoft YaHei",sans-serif}
    #boot{height:100%;display:grid;place-items:center;color:#334155;text-align:center;padding:24px;box-sizing:border-box}
    .err{max-width:760px;line-height:1.7}
  </style>
</head>
<body>
  <div id="boot">正在加载青岛旅行地图…</div>
  <script>
    (async()=>{
      const boot=document.getElementById('boot');
      const concatBytes=parts=>{
        const out=new Uint8Array(parts.reduce((sum,part)=>sum+part.length,0));
        let offset=0;
        for(const part of parts){out.set(part,offset);offset+=part.length}
        return out;
      };
      const decodeBase64File=(text,label)=>{
        const clean=text.replace(/[^A-Za-z0-9+/=]/g,'');
        const core=clean.replace(/=/g,'');
        if(!core)throw new Error(label+' is empty');
        const remainder=core.length%4;
        if(remainder===1)throw new Error(label+' has invalid Base64 length');
        const normalized=core+'='.repeat((4-remainder)%4);
        try{return Uint8Array.from(atob(normalized),c=>c.charCodeAt(0))}
        catch(e){throw new Error(label+' Base64 decode failed: '+e.message)}
      };
      const loadVersion=async version=>{
        const root=location.pathname.includes('/versions/')?'../':'';
        const base=root+'assets/v'+version+'/';
        const names=['payload-0.b64','payload-1.b64','payload-2.b64','payload-3.b64'];
        const texts=await Promise.all(names.map(async name=>{
          const response=await fetch(base+name+'?loader=1.0.12',{cache:'no-store'});
          if(!response.ok)throw new Error(name+' HTTP '+response.status);
          return response.text();
        }));
        const bytes=concatBytes(texts.map((text,index)=>decodeBase64File(text,names[index])));
        if(bytes.length<2||bytes[0]!==0x1f||bytes[1]!==0x8b)throw new Error('not a gzip stream');
        if(typeof DecompressionStream!=='function')throw new Error('browser lacks gzip decompression support');
        const html=await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
        if(!/^\s*(?:<!doctype html|<html)/i.test(html))throw new Error('decompressed content is not HTML');
        return html;
      };

      try{
        const candidates=['1.0.11','1.0.10'];
        const failures=[];
        let html='';
        let loadedVersion='';
        for(const version of candidates){
          boot.textContent='正在加载青岛旅行地图 v'+version+'…';
          try{
            html=await loadVersion(version);
            loadedVersion=version;
            break;
          }catch(error){
            failures.push('v'+version+': '+error.message);
          }
        }
        if(!html)throw new Error(failures.join('；'));
        console.info('Loaded travel map v'+loadedVersion+(loadedVersion==='1.0.10'?' (stable fallback)':''));
        document.open();
        document.write(html);
        document.close();
      }catch(error){
        boot.innerHTML='<div class="err"><b>页面加载失败。</b><br>请刷新页面或使用最新版 Chrome、Edge、Safari、Firefox。<br><small>'+String(error)+'</small></div>';
      }
    })();
  </script>
  <noscript><div class="err">此页面需要启用 JavaScript。</div></noscript>
</body>
</html>
