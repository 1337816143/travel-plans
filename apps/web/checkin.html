<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="robots" content="noindex,nofollow" />
    <meta name="qingdao-current-guide-version" content="2.5.7" />
    <title>青岛打卡机位 · v3</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        font-family: Inter, 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
        background: #edf3f5;
        color: #17384a;
      }
      body {
        display: grid;
        grid-template-rows: auto 1fr;
        overflow: hidden;
      }
      .bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        padding: 10px 14px;
        background: #fff;
        border-bottom: 1px solid #d7e2e7;
        z-index: 3;
      }
      .brand {
        display: grid;
        gap: 1px;
      }
      .brand span {
        font-size: 9px;
        font-weight: 900;
        letter-spacing: 0.12em;
        color: #317790;
      }
      .brand strong {
        font-size: 15px;
      }
      .nav {
        display: flex;
        gap: 6px;
        overflow-x: auto;
      }
      .nav a {
        flex: 0 0 auto;
        text-decoration: none;
        border: 1px solid #ccdce4;
        border-radius: 999px;
        padding: 6px 9px;
        color: #486675;
        font-size: 10px;
        font-weight: 800;
      }
      .nav a.active {
        background: #164f68;
        color: #fff;
        border-color: #164f68;
      }
      .frame {
        width: 100%;
        height: 100%;
        border: 0;
        background: #dbe4e8;
      }
      @media (max-width: 600px) {
        .bar {
          padding: 8px 9px;
        }
        .brand strong {
          font-size: 13px;
        }
        .brand span {
          display: none;
        }
        .nav a {
          padding: 6px 8px;
          font-size: 9px;
        }
      }
    </style>
  </head>
  <body>
    <header class="bar">
      <div class="brand"><span>QINGDAO TRIP LAB · PHOTO SPOTS</span><strong>打卡机位</strong></div>
      <nav class="nav" aria-label="v3工作区">
        <a href="./index.html#complete-guide">完整攻略</a>
        <a class="active" href="./checkin.html" aria-current="page">打卡机位</a>
        <a href="./rain.html">雨天备用</a>
        <a href="./index.html#planner-workspace">自定义规划</a>
      </nav>
    </header>
    <iframe
      class="frame"
      src="../index.html?embedded=v3&checkin=1#checkin"
      title="青岛v2.5.7打卡机位地图"
      allow="geolocation; clipboard-write"
    ></iframe>

    <script data-checkin-entry-bridge>
      (() => {
        const frame = document.querySelector('iframe.frame');
        if (!frame) return;
        let timer = 0;
        const activate = () => {
          try {
            const child = frame.contentWindow;
            const doc = frame.contentDocument;
            if (!child || !doc) return false;
            if (child.TravelCheckinSpots?.open) child.TravelCheckinSpots.open();
            const tab = doc.querySelector('[data-tab="checkin"]');
            const panel = doc.querySelector('[data-panel="checkin"]');
            if (!tab || !panel) return false;
            const shell = doc.getElementById('panel') || doc.querySelector('.panel');
            if (child.matchMedia?.('(max-width:800px)').matches) shell?.classList.add('open');
            doc.querySelectorAll('.tab-btn').forEach((node) => {
              const active = node === tab;
              node.classList.toggle('active', active);
              node.setAttribute('aria-selected', String(active));
            });
            doc
              .querySelectorAll('.tab-panel')
              .forEach((node) => node.classList.toggle('active', node === panel));
            panel.hidden = false;
            return panel.classList.contains('active');
          } catch {
            return false;
          }
        };
        const start = () => {
          window.clearInterval(timer);
          const startedAt = Date.now();
          timer = window.setInterval(() => {
            const active = activate();
            if ((active && Date.now() - startedAt > 1200) || Date.now() - startedAt > 12000) {
              window.clearInterval(timer);
            }
          }, 120);
        };
        frame.addEventListener('load', start);
        start();
      })();
    </script>
  </body>
</html>
